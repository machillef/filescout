# FileScout SonarQube Cloud configuration
#
# Required GitHub repository settings:
# - Secret: SONAR_TOKEN
# - Variable: SONAR_ORG
# - Variable: SONAR_PROJECT_KEY
#
# For C++ analysis, SonarQube Cloud should use CI-based analysis with Automatic
# Analysis disabled. The workflow writes the compilation database to the fixed
# path below via Sonar Build Wrapper.

sonar.projectName=FileScout
sonar.sources=native/FileScout.Native
sonar.tests=native/FileScout.Tests
sonar.sourceEncoding=UTF-8
sonar.cfamily.compile-commands=.sonar/build-wrapper/compile_commands.json

# Exclude build artifacts and generated directories if they appear in scans.
sonar.exclusions=**/bin/**,**/obj/**,**/Generated Files/**
sonar.test.inclusions=native/FileScout.Tests/**
