[workspace]
resolver = "2"
members = [
    "crates/filescout-app",
    "crates/filescout-core",
    "crates/filescout-ui",
    "crates/filescout-ai",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TODO/filescout"

[workspace.dependencies]
# GUI
iced = { version = "0.14", features = ["tokio", "image"] }

# Archive
zip = "2"

# Async
tokio = { version = "1", features = ["full"] }

# File system
notify = "8"
walkdir = "2"
trash = "5"
open = "5"
dirs = "6"

# Search
fuzzy-matcher = "0.3"

# Serialization & config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Images & media
image = "0.25"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Parallelism
rayon = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Clipboard
arboard = "3"

# Windows shell integration (icons, context menus)
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
] }

# Internal crates
filescout-core = { path = "crates/filescout-core" }
filescout-ui = { path = "crates/filescout-ui" }
filescout-ai = { path = "crates/filescout-ai" }
