name: Release

# Builds a Release x64 zip on a GitHub-hosted runner and publishes it to GitHub Releases.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty for v0.1.0-<short-sha>)'
        required: false
        default: ''
      navdiag:
        description: 'Include opt-in NavDiag + diagnostics launcher'
        type: boolean
        required: false
        default: true
      prerelease:
        description: 'Mark as GitHub pre-release'
        type: boolean
        required: false
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check the requested tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG.Trim()
            git fetch --tags --quiet origin
            $existing = git rev-list -n 1 "refs/tags/$tag" 2>$null
            $head = (git rev-parse HEAD).Trim()
            if ($existing -and ($existing.Trim() -ne $head)) {
              throw "Tag '$tag' already exists on commit $($existing.Trim()), which does not match HEAD ($head). Dispatch from that tag or pick a new tag name."
            }
          }

      - name: Build Release x64
        shell: pwsh
        env:
          INPUT_NAVDIAG: ${{ github.event_name == 'workflow_dispatch' && inputs.navdiag || false }}
        run: |
          $argsList = @(
            '-NoProfile', '-File', 'tools/win1/build.ps1',
            '-Root', $env:GITHUB_WORKSPACE,
            '-Configuration', 'Release',
            '-Target', 'Build'
          )
          if ($env:INPUT_NAVDIAG -eq 'true') {
            $argsList += @('-Property', 'FileScoutNavDiag=true')
          }
          & pwsh @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NAVDIAG: ${{ github.event_name == 'workflow_dispatch' && inputs.navdiag || false }}
          INPUT_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shortSha = (git rev-parse --short HEAD).Trim()
          $tag = if ($env:EVENT_NAME -eq 'push') {
            $env:REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $env:INPUT_TAG.Trim()
          } else {
            "v0.1.0-$shortSha"
          }

          $binDir = Join-Path $env:GITHUB_WORKSPACE 'native\x64\Release\FileScout.Native'
          $stage  = Join-Path $env:RUNNER_TEMP "filescout-release-$shortSha"
          $zip    = Join-Path $env:RUNNER_TEMP "FileScout-Release-x64-$tag.zip"
          Remove-Item -Recurse -Force $stage, $zip -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse -Force "$binDir\*" $stage

          if ($env:INPUT_NAVDIAG -eq 'true') {
            Copy-Item -Force (Join-Path $env:GITHUB_WORKSPACE 'tools\perf\Run-WithDiagnostics.ps1') $stage
          }

          $exeHash = (Get-FileHash (Join-Path $stage 'FileScoutNative.exe') -Algorithm SHA256).Hash
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash

          $diagLabel = if ($env:INPUT_NAVDIAG -eq 'true') { 'enabled (`FileScoutNavDiag=true` + `Run-WithDiagnostics.ps1`)' } else { 'disabled (standard Release)' }
          $notes = @(
            "Release x64 build from commit ``$shortSha`` (Windows App Runtime 2.6 x64 required)."
            ''
            "- **NavDiag:** $diagLabel"
            '- **Symbols:** `FileScoutNative.pdb` included for ETW / WPA profiling'
            "- **SHA-256 ``FileScout-Release-x64-$tag.zip``:** ``$zipHash``"
            "- **SHA-256 ``FileScoutNative.exe``:** ``$exeHash``"
          ) -join "`n"

          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent'           = 'filescout-release-workflow'
          }
          $payload = @{
            tag_name         = $tag
            target_commitish = $env:GITHUB_SHA
            name             = "FileScout $tag (Release x64)"
            body             = $notes
            draft            = $true
            prerelease       = ($env:INPUT_PRERELEASE -eq 'true')
          } | ConvertTo-Json -Depth 4

          $release = Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" `
            -Headers $headers `
            -ContentType 'application/json; charset=utf-8' `
            -Body $payload

          try {
            $zipName = Split-Path -Leaf $zip
            $uploadBase = ($release.upload_url -replace '\{.*$', '')
            $uploadUrl = "${uploadBase}?name=$([Uri]::EscapeDataString($zipName))"
            $uploadHeaders = $headers.Clone()
            $uploadHeaders['Content-Type'] = 'application/zip'

            $asset = Invoke-RestMethod `
              -Method Post `
              -Uri $uploadUrl `
              -Headers $uploadHeaders `
              -InFile $zip

            $publishPayload = @{ draft = $false } | ConvertTo-Json
            $published = Invoke-RestMethod `
              -Method Patch `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" `
              -Headers $headers `
              -ContentType 'application/json; charset=utf-8' `
              -Body $publishPayload
          }
          catch {
            Invoke-RestMethod `
              -Method Delete `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" `
              -Headers $headers `
              -ErrorAction SilentlyContinue | Out-Null
            throw
          }

          Write-Host "Published release: $($published.html_url)"
          Write-Host "Uploaded asset   : $($asset.browser_download_url)"
