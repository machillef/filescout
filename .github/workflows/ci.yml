name: CI

# Build + gtests on every PR and on master, on a GitHub-hosted runner. Never a self-hosted one:
# the repo is public. windows-2022 keeps VS 2022 and the v143 toolset (windows-latest has VS 2026).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build (Debug x64) and run gtests
        shell: pwsh
        run: >
          pwsh -NoProfile -File tools/win1/build.ps1
          -Root $env:GITHUB_WORKSPACE
          -Configuration Debug
          -Target Rebuild
          -Test
